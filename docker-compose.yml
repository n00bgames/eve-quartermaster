name: eve-quartermaster

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eve_quartermaster
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eve -d eve_quartermaster"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_NAME: eve-quartermaster
      DATABASE_URL: postgresql+psycopg://eve:eve@postgres:5432/eve_quartermaster
      REDIS_URL: redis://redis:6379/0
      EVE_SSO_CLIENT_ID: ${EVE_SSO_CLIENT_ID:-}
      EVE_SSO_CLIENT_SECRET: ${EVE_SSO_CLIENT_SECRET:-}
      EVE_SSO_CALLBACK_URL: ${EVE_SSO_CALLBACK_URL:-http://localhost:8000/api/esi/auth/callback}
      ESI_COMPATIBILITY_DATE: ${ESI_COMPATIBILITY_DATE:-2026-07-22}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-change-me}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-720}
      REMEMBER_ME_DAYS: ${REMEMBER_ME_DAYS:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,https://eqm.easyduneadmin.app}
      SDE_SOURCE_PATH: ${SDE_SOURCE_PATH:-/sde}
      KILLBOARD_ENABLED_DEFAULT: ${KILLBOARD_ENABLED_DEFAULT:-true}
      KILLBOARD_SYNC_PERIOD_HOURS_DEFAULT: ${KILLBOARD_SYNC_PERIOD_HOURS_DEFAULT:-6}
      KILLBOARD_LOOKBACK_DAYS_DEFAULT: ${KILLBOARD_LOOKBACK_DAYS_DEFAULT:-90}
      KILLBOARD_REQUEST_DELAY_SECONDS_DEFAULT: ${KILLBOARD_REQUEST_DELAY_SECONDS_DEFAULT:-1.0}
      KILLBOARD_MAX_PAGES_DEFAULT: ${KILLBOARD_MAX_PAGES_DEFAULT:-10}
      EQM_PI_ENGINE: ${EQM_PI_ENGINE:-rust}
      EQM_FITTING_ENGINE: ${EQM_FITTING_ENGINE:-rust}
      EQM_FITTING_STATS_ENGINE: ${EQM_FITTING_STATS_ENGINE:-rust}
      EQM_ANALYTICS_ENGINE: ${EQM_ANALYTICS_ENGINE:-rust}
      EQM_BOUNTY_ANALYTICS_ENGINE: ${EQM_BOUNTY_ANALYTICS_ENGINE:-rust}
      EQM_JUMP_ROUTE_ENGINE: ${EQM_JUMP_ROUTE_ENGINE:-rust}
      EQM_SETTLEMENT_MATH_ENGINE: ${EQM_SETTLEMENT_MATH_ENGINE:-rust}
      EQM_KILLBOARD_ANALYTICS_ENGINE: ${EQM_KILLBOARD_ANALYTICS_ENGINE:-rust}
      EQM_SRP_ANALYTICS_ENGINE: ${EQM_SRP_ANALYTICS_ENGINE:-rust}
      EQM_BATTLE_REPORT_ENGINE: ${EQM_BATTLE_REPORT_ENGINE:-rust}
      EQM_HYPERNET_ENGINE: ${EQM_HYPERNET_ENGINE:-rust}
      EQM_THREAT_ANALYTICS_ENGINE: ${EQM_THREAT_ANALYTICS_ENGINE:-rust}
      EQM_EVENT_ANALYTICS_ENGINE: ${EQM_EVENT_ANALYTICS_ENGINE:-rust}
      EQM_PLANETARY_ANALYTICS_ENGINE: ${EQM_PLANETARY_ANALYTICS_ENGINE:-rust}
      EQM_FINANCIAL_ANALYTICS_ENGINE: ${EQM_FINANCIAL_ANALYTICS_ENGINE:-rust}
      EQM_CORE_BINARY: ${EQM_CORE_BINARY:-/usr/local/bin/eqm-core}
      EQM_CORE_TIMEOUT_SECONDS: ${EQM_CORE_TIMEOUT_SECONDS:-5}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${SDE_HOST_PATH:-./sde}:/sde:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: rq worker --url redis://redis:6379/0 eve-quartermaster
    environment:
      APP_NAME: eve-quartermaster
      DATABASE_URL: postgresql+psycopg://eve:eve@postgres:5432/eve_quartermaster
      REDIS_URL: redis://redis:6379/0
      ESI_COMPATIBILITY_DATE: ${ESI_COMPATIBILITY_DATE:-2026-07-22}
      SDE_SOURCE_PATH: ${SDE_SOURCE_PATH:-/sde}
    volumes:
      - ${SDE_HOST_PATH:-./sde}:/sde:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  backend-tests:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test

  eqm-core-tests:
    profiles: ["test"]
    image: rust:1.89-slim
    working_dir: /workspace/rust/eqm-core
    command: cargo test --locked
    volumes:
      - .:/workspace
      - cargo_registry:/usr/local/cargo/registry
      - cargo_target:/workspace/rust/eqm-core/target

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE: ${VITE_API_BASE:-/api}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-eqm.easyduneadmin.app}
      VITE_PROXY_API_TARGET: ${VITE_PROXY_API_TARGET:-http://backend:8000}
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  cargo_registry:
  cargo_target:
