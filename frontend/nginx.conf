upstream eqm_backend {
    zone eqm_backend 64k;
    # Docker can assign a new address when only the backend is recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;
    server backend:8000 resolve;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        client_max_body_size 10m;
        # Inventory responses can be several MB; compress them before the
        # browser's request deadline, including authenticated proxy traffic.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/json;

        proxy_pass http://eqm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ ^/(?:@fs|@vite|@id|__vite) {
        return 404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
