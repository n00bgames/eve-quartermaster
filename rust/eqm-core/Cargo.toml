[package]
name = "eqm-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic calculation core and cross-language parity harness for EVE Quartermaster"
license = "GPL-3.0-or-later"

[lib]
name = "eqm_core"
path = "src/lib.rs"

[[bin]]
name = "eqm-core"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
